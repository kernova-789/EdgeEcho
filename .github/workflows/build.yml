name: Build, test and package
on: [push, pull_request, workflow_dispatch]
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            qt_arch: gcc_64
          - os: windows-latest
            qt_arch: win64_msvc2022_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          cache: true
      - name: Linux runtime packaging dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf libxcb-cursor0 libxkbcommon-x11-0
      - name: Validate current desktop sources with fresh test evidence
        run: python tools/validate_current.py --profiles release --report build/current-validation.json
      - name: Package Linux runtime
        if: runner.os == 'Linux'
        run: |
          python3 tools/package_linux.py --build-dir build --output dist
          python3 tools/validate_package.py --package dist/EdgeEcho-0.4.0-linux-x86_64 --output build/package-validation --validation-report build/current-validation.json
      - name: Package Windows runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./tools/package_windows.ps1 -BuildDir build -Output dist
          python tools/validate_package.py --package dist/EdgeEcho-0.4.0-windows-x86_64 --output build/package-validation --validation-report build/current-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-${{ matrix.os }}
          path: |
            build/current-validation.json
            build/validation-current/
            build/Testing/Temporary/
            build/test-data/gui-smoke.png
            build/test-data/gui-inputs/
            build/package-validation/
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.os }}
          path: |
            dist/*.tar.gz
            dist/*.zip
  linux-sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate instrumented core with fresh evidence
        run: python3 tools/validate_current.py --profiles asan --report build-asan/current-validation.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-linux-sanitizers
          path: |
            build-asan/current-validation.json
            build/validation-current/
  release:
    needs: [desktop, linux-sanitizers]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: runtime-*
          path: release-assets
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/*.tar.gz
            release-assets/*.zip
          generate_release_notes: true
