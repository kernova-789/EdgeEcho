<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1528"/>
      <stop offset="52%" stop-color="#102342"/>
      <stop offset="100%" stop-color="#091326"/>
    </linearGradient>

    <!-- Outer Rim Metallic / Cyan Sheen -->
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#F97316" stop-opacity="0.80"/>
    </linearGradient>

    <!-- Primary Waveform Gradient (Cyan to Azure to Coral) -->
    <linearGradient id="waveGrad" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#00F5D4"/>
      <stop offset="48%" stop-color="#38BDF8"/>
      <stop offset="78%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>

    <!-- Echo Ripple Gradient -->
    <linearGradient id="echoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#FF6B35" stop-opacity="0.45"/>
    </linearGradient>

    <!-- Spectrum Bar Vertical Gradient -->
    <linearGradient id="barGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.18"/>
      <stop offset="65%" stop-color="#38BDF8" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.90"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="48%">
      <stop offset="0%" stop-color="#0EA5E9" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#6366F1" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0B1528" stop-opacity="0.0"/>
    </radialGradient>

    <!-- Soft Drop Shadow for Foreground Elements -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- 1. Base Rounded Squircle Card -->
  <rect x="24" y="24" width="464" height="464" rx="108" ry="108" fill="url(#bgGrad)"/>
  <rect x="27" y="27" width="458" height="458" rx="105" ry="105" fill="none" stroke="url(#rimGrad)" stroke-width="5"/>

  <!-- 2. Ambient Center Radial Glow -->
  <circle cx="256" cy="256" r="210" fill="url(#coreGlow)"/>

  <!-- 3. Subtle Oscilloscope Polar Grid & Time-Frequency Axes -->
  <g stroke="#38BDF8" stroke-opacity="0.10" stroke-width="1.5">
    <line x1="68" y1="176" x2="444" y2="176"/>
    <line x1="68" y1="256" x2="444" y2="256" stroke-opacity="0.20" stroke-dasharray="6 6"/>
    <line x1="68" y1="336" x2="444" y2="336"/>
    <line x1="176" y1="68" x2="176" y2="444"/>
    <line x1="256" y1="68" x2="256" y2="444" stroke-opacity="0.20" stroke-dasharray="6 6"/>
    <line x1="336" y1="68" x2="336" y2="444"/>
  </g>

  <!-- 4. Concentric Acoustic "Echo" Ripples (Right-side Sonic Propagation) -->
  <g fill="none" stroke="url(#echoGrad)" stroke-linecap="round">
    <path d="M 332 162 A 130 130 0 0 1 332 350" stroke-width="5" stroke-opacity="0.50"/>
    <path d="M 366 130 A 175 175 0 0 1 366 382" stroke-width="4" stroke-opacity="0.34" stroke-dasharray="14 10"/>
    <path d="M 180 350 A 130 130 0 0 1 180 162" stroke-width="4" stroke-opacity="0.28"/>
  </g>

  <!-- 5. Precision Hexagonal MEMS Sensor Frame -->
  <polygon points="256,74 414,165 414,347 256,438 98,347 98,165"
           fill="#0D1F3C" fill-opacity="0.45"
           stroke="url(#rimGrad)" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- 6. STFT / FFT Spectrum Bars Inside Lower Half of Hexagon -->
  <g fill="url(#barGrad)">
    <rect x="136" y="302" width="12" height="42" rx="6"/>
    <rect x="158" y="284" width="12" height="60" rx="6"/>
    <rect x="180" y="266" width="12" height="78" rx="6"/>
    <rect x="202" y="292" width="12" height="52" rx="6"/>
    <rect x="224" y="236" width="12" height="108" rx="6"/>
    <rect x="246" y="206" width="12" height="138" rx="6"/>
    <rect x="268" y="248" width="12" height="96" rx="6"/>
    <rect x="290" y="276" width="12" height="68" rx="6"/>
    <rect x="312" y="256" width="12" height="88" rx="6"/>
    <rect x="334" y="288" width="12" height="56" rx="6"/>
    <rect x="356" y="306" width="12" height="38" rx="6"/>
  </g>

  <!-- 7. Secondary Background Harmonic Trace (XYZ Vibration Envelope) -->
  <path d="M 82 256 C 118 256, 134 198, 162 214 C 190 230, 206 324, 232 292 C 258 260, 274 156, 302 188 C 330 220, 348 296, 378 266 C 402 242, 414 256, 430 256"
        fill="none" stroke="#FF6B35" stroke-width="4.5" stroke-opacity="0.55" stroke-linecap="round"/>

  <!-- 8. Primary Luminous Acoustic & Vibration Waveform Pulse -->
  <path d="M 76 256 L 122 256 L 146 212 L 172 308 L 202 156 L 234 364 L 268 116 L 302 328 L 332 194 L 358 282 L 382 256 L 436 256"
        fill="none" stroke="url(#waveGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <!-- 9. Replay Playhead / Dominant Resonance Peak Beacon -->
  <line x1="268" y1="88" x2="268" y2="424" stroke="#FF6B35" stroke-width="2.5" stroke-dasharray="7 6" stroke-opacity="0.80"/>
  <circle cx="268" cy="116" r="16" fill="#FF6B35" fill-opacity="0.28"/>
  <circle cx="268" cy="116" r="8.5" fill="#FF6B35" stroke="#FFFFFF" stroke-width="2.5"/>

  <!-- 10. Corner Replay Badge Accent (Top-Right Play Triangle Indicator) -->
  <polygon points="384,110 416,128 384,146" fill="#00F5D4" fill-opacity="0.90"/>
</svg>
